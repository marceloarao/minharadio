<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Rádio</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --txt:#1d1d1f; --mut:#6e6e73; --acc:#3b6fe0; --bd:#e0e0e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --card:#222327; --txt:#f2f2f4; --mut:#9a9aa2; --acc:#6b97ff; --bd:#33343a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:16px; margin-bottom:14px; }
  h1 { font-size:1.2rem; margin:0 0 12px; }
  label { display:block; font-size:.8rem; color:var(--mut); margin:8px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:9px; border-radius:8px; border:1px solid var(--bd); background:var(--bg); color:var(--txt); }
  button { cursor:pointer; border:1px solid var(--bd); background:var(--bg); color:var(--txt); border-radius:10px; padding:9px 14px; font-size:1rem; }
  button.main { background:var(--acc); color:#fff; border-color:var(--acc); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #stations { width:100%; padding:12px 14px; font-size:1rem; font-weight:700; font-family:inherit;
    color:#fff; background:var(--acc); border:2px solid var(--acc); border-radius:12px; cursor:pointer; }
  #stations:focus { outline:none; box-shadow:0 0 0 3px var(--bd); }
  #stations option { background:var(--card); color:var(--txt); font-weight:400; }
  #stationsCard label { margin:0 0 6px; }
  #stationsCard { padding:12px; }
  #title { font-weight:600; font-size:1.05rem; margin-bottom:10px; word-break:break-word; }
  video { width:100%; border-radius:10px; background:#000; margin-bottom:10px; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .time { font-size:.8rem; color:var(--mut); display:flex; justify-content:space-between; }
  #list { max-height:320px; overflow-y:auto; margin:8px 0 0; padding:0; list-style:none; }
  #list li { padding:8px; border-radius:8px; cursor:pointer; font-size:.9rem; word-break:break-word; }
  #list li:hover { background:var(--bg); }
  #list li.on { background:var(--acc); color:#fff; }
  #status { font-size:.85rem; color:var(--mut); margin-top:8px; }
  .ctrl { justify-content:center; margin:10px 0; }
  .vol { display:flex; gap:8px; align-items:center; font-size:.85rem; color:var(--mut); }
  .vol input { flex:1; }
</style>
</head>
<body>
<main>
  <div class="card" id="config">
    <h1>🎵 Minha Rádio</h1>
    <label for="folder">Link ou ID da pasta do Drive</label>
    <input type="text" id="folder" placeholder="https://drive.google.com/drive/folders/...">
    <label for="key">Chave de API do Google (Drive API v3)</label>
    <input type="password" id="key" placeholder="AIza...">
    <div class="row" style="margin-top:12px">
      <button class="main" id="load">Carregar músicas</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card" id="stationsCard" style="display:none">
    <label for="stations">Estação</label>
    <select id="stations"></select>
  </div>

  <div class="card">
    <div id="title">Carregando músicas...</div>
    <div id="hint" class="time" style="margin-bottom:8px"></div>
    <video id="media" playsinline></video>
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="row ctrl">
      <button id="prev" title="Anterior">⏮</button>
      <button class="main" id="play" title="Tocar/Pausar">▶</button>
      <button id="next" title="Próxima">⏭</button>
      <button id="shuf" title="Embaralhar de novo">🔀</button>
    </div>
    <div class="vol">🔊 <input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div>
  </div>

  <div class="card">
    <strong id="count">Playlist</strong>
    <ul id="list"></ul>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const media = $('media');

// ===== CONFIGURAÇÃO =====
const DEFAULT_KEY = 'AIzaSyBvtFzCMVkNlJfW9fxS71fSAXKpijPEa5c';
// Cada linha é uma estação. A primeira toca ao abrir o app.
const STATIONS = [
  { nome: 'Louvores',  pasta: 'https://drive.google.com/drive/folders/1u794n3TRddzlbdVE3KXQVDCdVBwAYsLM?usp=sharing' },
   { nome: 'Instrumental',  pasta: 'https://drive.google.com/drive/folders/1JnljJZNfULpkqFPiHQhHhNGPUwuGWnpC?usp=sharing' },
  // { nome: 'Clássicas', pasta: 'https://drive.google.com/drive/folders/ID_DA_PASTA_3' },
];
// ========================

let stations = [], cache = {}, files = [], order = [], pos = 0, current = -1, loadId = 0;
const AUTO = !!(DEFAULT_KEY && STATIONS.length);

if (AUTO) {
  stations = STATIONS;
  $('key').value = DEFAULT_KEY;
  $('config').style.display = 'none';
} else {
  try {
    $('folder').value = localStorage.getItem('folder') || '';
    $('key').value = localStorage.getItem('key') || '';
  } catch (e) {}
}

const getKey = () => $('key').value.trim();

function folderId(s) {
  s = s.trim();
  const m = s.match(/folders\/([\w-]+)/) || s.match(/[?&]id=([\w-]+)/);
  return m ? m[1] : s;
}

function fmt(t) {
  if (!isFinite(t)) return '0:00';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function shuffle() {
  order = files.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
}

async function fetchFolder(folder, key) {
  let out = [], token = '';
  do {
    const q = `'${folder}' in parents and trashed=false and (mimeType contains 'audio/' or mimeType contains 'video/')`;
    const url = 'https://www.googleapis.com/drive/v3/files?pageSize=1000&orderBy=name'
      + '&fields=nextPageToken,files(id,name,mimeType)'
      + '&q=' + encodeURIComponent(q) + '&key=' + encodeURIComponent(key)
      + (token ? '&pageToken=' + token : '');
    const d = await (await fetch(url)).json();
    if (d.error) throw new Error(d.error.message);
    out.push(...d.files);
    token = d.nextPageToken || '';
  } while (token);
  return out;
}

function buildStations() {
  const sel = $('stations');
  sel.innerHTML = '';
  stations.forEach((st, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = st.nome;
    sel.appendChild(o);
  });
  sel.onchange = () => { const i = +sel.value; if (i !== current) loadStation(i); };
  $('stationsCard').style.display = stations.length > 1 ? 'block' : 'none';
}

function markStation() {
  $('stations').value = current;
}

async function loadStation(i) {
  const id = ++loadId;
  current = i;
  markStation();
  media.pause();
  $('title').textContent = 'Carregando ' + stations[i].nome + '...';
  $('hint').textContent = '';
  try {
    if (!cache[i]) cache[i] = await fetchFolder(folderId(stations[i].pasta), getKey());
  } catch (e) {
    if (id !== loadId) return;
    $('status').textContent = 'Erro: ' + e.message;
    $('config').style.display = 'block';
    return;
  }
  if (id !== loadId) return;
  files = cache[i];
  $('count').textContent = 'Playlist (' + files.length + ')';
  renderList();
  if (!files.length) { $('title').textContent = 'Nenhum arquivo de áudio/vídeo nesta pasta.'; return; }
  shuffle();
  playCurrent();
}

function renderList() {
  const ul = $('list');
  ul.innerHTML = '';
  files.forEach((f, i) => {
    const li = document.createElement('li');
    li.textContent = f.name.replace(/\.[^.]+$/, '');
    li.dataset.i = i;
    li.onclick = () => { order = order.filter(x => x !== i); order.splice(pos + 1, 0, i); pos++; playCurrent(); };
    ul.appendChild(li);
  });
}

function playCurrent() {
  const i = order[pos], f = files[i];
  media.src = 'https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media&key=' + encodeURIComponent(getKey());
  media.style.display = f.mimeType.startsWith('video/') ? 'block' : 'none';
  $('title').textContent = f.name.replace(/\.[^.]+$/, '');
  document.querySelectorAll('#list li').forEach(li => li.classList.toggle('on', +li.dataset.i === i));
  const on = document.querySelector('#list li.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
  $('hint').textContent = '';
  media.play().catch(() => { $('hint').textContent = 'Toque em ▶ para começar.'; });
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: $('title').textContent });
}

function next() {
  if (!files.length) return;
  pos++;
  if (pos >= order.length) shuffle();
  playCurrent();
}
function prev() {
  if (!files.length) return;
  if (media.currentTime > 3 || pos === 0) { media.currentTime = 0; return; }
  pos--;
  playCurrent();
}

// Modo manual (sem estações no código): usa os campos da tela
$('load').onclick = () => {
  const folder = $('folder').value, key = getKey();
  if (!folder || !key) { $('status').textContent = 'Informe a pasta e a chave de API.'; return; }
  try { localStorage.setItem('folder', folder); localStorage.setItem('key', key); } catch (e) {}
  $('status').textContent = '';
  stations = [{ nome: 'Pasta', pasta: folder }];
  cache = {}; current = -1;
  buildStations();
  loadStation(0);
};

$('next').onclick = next;
$('prev').onclick = prev;
$('shuf').onclick = () => { if (files.length) { shuffle(); playCurrent(); } };
$('play').onclick = () => { if (!files.length) return; media.paused ? media.play() : media.pause(); };
media.onplay = () => $('play').textContent = '⏸';
media.onpause = () => $('play').textContent = '▶';
media.onended = next;
media.onerror = () => { $('hint').textContent = 'Não consegui tocar este arquivo; indo para o próximo.'; setTimeout(next, 1200); };
media.ontimeupdate = () => {
  $('cur').textContent = fmt(media.currentTime);
  if (media.duration) $('seek').value = (media.currentTime / media.duration) * 100;
};
media.onloadedmetadata = () => $('dur').textContent = fmt(media.duration);
$('seek').oninput = e => { if (media.duration) media.currentTime = (e.target.value / 100) * media.duration; };
$('vol').oninput = e => media.volume = e.target.value;

if (AUTO) { buildStations(); loadStation(0); }

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('nexttrack', next);
  navigator.mediaSession.setActionHandler('previoustrack', prev);
}
</script>
</body>
</html>
